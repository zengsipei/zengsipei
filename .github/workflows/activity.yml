name: Update Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update activity
        run: node .github/scripts/update-activity.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity section"
